<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Visual Agent Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a borderless prompt line; beneath it a dithered "mind" tile that morphs to each step the model narrates, then the answer. */
:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --field: #ffffff;
  --inset: #efeff1;
  --ink: #1f2023;
  --ink-2: #55575d;
  --ink-3: #8e9097;
  --line: #e2e3e6;
  --line-strong: #cfd1d5;
  --hover: rgba(20, 22, 28, .035);
  --hover-2: rgba(20, 22, 28, .055);
  --green: #2f8a5b;
  --red: #c4483e;
  --btn: #000000;
  --btn-fg: #ffffff;
  --hairline: 0 0 0 1px rgba(20, 22, 28, .07);
  --tile-bg: #f7f7f7;
  --tile-fg: #2c2d31;
  --tile-ink: #2c2d31;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1d1e22; --field: #1d1e22; --inset: #1b1c20;
    --ink: #ececef; --ink-2: #b4b6bc; --ink-3: #7d8088; --line: #2a2c31; --line-strong: #3a3d43;
    --hover: rgba(255,255,255,.04); --hover-2: rgba(255,255,255,.065); --green: #5fc08c; --red: #ec7a70;
    --btn: #ffffff; --btn-fg: #000000; --hairline: 0 0 0 1px rgba(255,255,255,.08); color-scheme: dark;
    --tile-bg: #141416; --tile-fg: #d6d7db; --tile-ink: #d6d7db;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1e22; --field: #1d1e22; --inset: #1b1c20;
  --ink: #ececef; --ink-2: #b4b6bc; --ink-3: #7d8088; --line: #2a2c31; --line-strong: #3a3d43;
  --hover: rgba(255,255,255,.04); --hover-2: rgba(255,255,255,.065); --green: #5fc08c; --red: #ec7a70;
  --btn: #ffffff; --btn-fg: #000000; --hairline: 0 0 0 1px rgba(255,255,255,.08); color-scheme: dark;
  --tile-bg: #141416; --tile-fg: #d6d7db; --tile-ink: #d6d7db;
}

[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--line-strong); outline-offset: 2px; }

@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(4px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer-text { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes pixel-on { 0%, 100% { opacity: .15; } 35% { opacity: 1; } }
@keyframes blur-in { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }

/* One centred reading column: prompt, thinking and answer all share its edges. */
.stage {
  width: 100%;
  max-width: calc(720px + 2 * max(16px, env(safe-area-inset-left, 0px)));
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18vh 80px;
}

/* ---------- prompt line ---------- */
.prompt { display: flex; align-items: center; gap: 10px; }
/* ---------- answer area ---------- */
.turn { display: flex; flex-direction: column; gap: 12px; }
.answer a { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.answer a:hover { text-decoration-color: currentColor; }
.prompt textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: none; overflow: hidden;
  font: 400 16px/24px var(--sans); letter-spacing: -.005em; color: var(--ink); padding: 0;
}
.prompt textarea::placeholder { color: var(--ink-3); }
.send {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--btn); color: var(--btn-fg); display: grid; place-items: center;
  transition: opacity .15s, transform .1s;
}
.send:disabled { opacity: .18; cursor: default; }
.send:not(:disabled):active { transform: scale(.94); }

.status { margin: 8px 0 0; font-size: 13px; color: var(--ink-3); }

/* ---------- mind tile (dithering) ---------- */
.run { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.mind {
  position: relative; width: min(340px, 100%); aspect-ratio: 1; max-width: 100%; margin-block: -8px 0;
  overflow: hidden; background: transparent;
}
.mind canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.mind-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tile-fg); font: 12px var(--mono); }

/* ---------- shared ---------- */
.shimmer {
  background-image: linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer-text 1.4s linear infinite;
}
.grid3 { display: inline-grid; flex: none; grid-template-columns: repeat(3, 4px); gap: 1.5px; }
.grid3 > span { width: 4px; height: 4px; border-radius: 1px; background: var(--ink); opacity: .15; }
.elapsed { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chev { flex: none; transition: transform 300ms var(--ease); }
.collapse { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 400ms var(--ease), opacity 400ms var(--ease); }
.collapse.open { grid-template-rows: 1fr; opacity: 1; }
.collapse > div { min-height: 0; overflow: hidden; }

/* ThinkingState */
.think { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 44px; animation: fade-up 300ms var(--ease) both; }
.think-side { flex: 1; min-width: 0; padding-top: 28px; display: flex; flex-direction: column; }
@media (max-width: 720px) { .think { flex-direction: column; gap: 12px; } .think-side { padding-top: 0; width: 100%; } }
.th-head { position: relative; padding: 2px 0; display: flex; width: fit-content; align-items: baseline; gap: 10px; }
.th-lead { position: absolute; left: -30px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; display: grid; place-items: center; color: var(--ink-3); transition: color .1s; }
.th-head:hover .th-lead { color: var(--ink); }
.th-label { font-size: 15px; font-weight: 500; white-space: nowrap; color: var(--ink); }
.th-label.done { animation: fade-in 350ms ease-out both; }
.th-time { font-size: 15px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.trace { margin: 4px 0 0 5px; padding: 4px 0 4px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.th-row { min-height: 28px; display: flex; align-items: center; gap: 8px; padding: 2px 6px; border-radius: 6px; text-align: left; animation: fade-up 320ms var(--ease) both; transition: background .1s; }
button.th-row:hover { background: var(--hover); }
.th-row.active { background: var(--hover-2); }
.th-row .p { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 500; color: var(--ink); }
.th-row .s { flex: none; font-size: 11px; color: var(--ink-3); font-family: var(--mono); text-transform: lowercase; }
.spinner { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--ink-2); animation: spin 700ms linear infinite; }

/* StreamingText */
.answer { font-size: 15px; line-height: 1.95; color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.answer:empty { display: none; }
.answer > :first-child { margin-top: 0; }
.answer > :last-child { margin-bottom: 0; }
.answer p, .answer ul, .answer ol { margin: 0 0 .75em; }
.answer ul, .answer ol { padding-left: 1.3em; }
.answer li { margin: .15em 0; }
.answer h3 { font-size: 15px; font-weight: 600; margin: 1em 0 .35em; }
.answer code { font-family: var(--mono); font-size: .9em; background: var(--inset); padding: .1em .35em; border-radius: 5px; }
.answer pre { background: var(--inset); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; }
.w { animation: blur-in 380ms ease-out both; }
.caret { display: inline-block; width: 2px; height: 15px; margin-left: 2px; border-radius: 999px; background: var(--ink); transform: translateY(2px); animation: fade-in 150ms ease-out both; }
.actions { margin-top: 2px; display: flex; align-items: center; gap: 2px; animation: fade-in 400ms ease-out both; }
.act { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-3); transition: background .1s, color .1s; }
.act:hover { background: var(--hover-2); color: var(--ink-2); }
.act[aria-pressed="true"] { color: var(--ink); }
.act-note { margin-left: 6px; font-size: 12px; color: var(--ink-3); animation: fade-in 200ms ease-out both; }
.fu { margin-top: 6px; }
.fu-title { margin: 0; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.fu-list { margin-top: 2px; display: flex; flex-direction: column; }
.fu-item { margin-inline: -6px; padding: 6px; display: flex; align-items: center; gap: 8px; text-align: left; border-radius: 7px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink); transition: background .1s; animation: fade-up 350ms var(--ease) both; }
.fu-item:hover { background: var(--hover-2); }
.note { margin: 0; font-size: 12.5px; color: var(--ink-3); }

/* ---------- simplified thinking: plain step lines only ---------- */
.th-time { font-size: 14.5px; }
.th-head { align-items: center; }
.th-lead { position: static; transform: none; } /* icon sits inline so the block starts at the request's left edge */
.think-side { padding-top: 8px; }
.trace { margin: 10px 0 0; padding: 0; border-left: 0; gap: 11px; }
.th-row { min-height: 0; padding: 0; gap: 0; background: none !important; }
.th-row > svg, .th-row .spinner, .th-row .s { display: none; }
.th-row .p { white-space: normal; overflow: visible; text-overflow: clip; font-size: 13px; font-weight: 400; line-height: 1.5; color: var(--ink-3); transition: color .3s; }
.th-row:last-child .p { color: var(--ink); }
.th-label { font-size: 14.5px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  .grid3 > span { animation: none !important; }
  .shimmer { animation: none; color: var(--ink-3); }
}
</style>

<div class="stage">
  <form class="prompt" id="prompt" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Ask anything." aria-label="Ask the agent"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>
      <svg id="sendIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="status" id="status" hidden></p>

  <section class="run" id="run" aria-live="polite">
    <div class="mind" id="mind" hidden>
      <canvas id="dither" aria-hidden="true"></canvas>
    </div>
    <div id="runBody"></div>
  </section>
</div>


<script>
(() => {
  const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  const SHAPES = ["sphere","diamond","chocolate","gift","heart","book","coffee","flower","star","ring","watch","music",

    "leaf","gamepad","headphones","laptop","coin","cube","jigsaw","robotarm"];

    birthday:"cake", drink:"wine", clothes:"shirt", fashion:"shirt", look:"search", find:"search", user:"person", people:"person",

  ALIAS.robot = "robotarm"; ALIAS.arm = "robotarm"; ALIAS.robotics = "robotarm";
  // Broader vocabulary so any topic lands on a fitting shape.
  Object.assign(ALIAS, {

uniform vec2 uRes; uniform float uTime; uniform int uA; uniform int uB; uniform float uT;

      gl.uniform1f(u.st, Math.max(0, Math.min(60, (now - t0) / 1000)));
      gl.uniform1f(u.energy, energy);
      gl.uniform1f(u.scale, 1 + .06 * Math.sin(Math.PI * t));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const settling = k < 1 || form < 1 || Math.abs(energyTarget - energy) > .01;
      if (visible && !document.hidden && (!reduced || settling)) raf = requestAnimationFrame(frame);
    }
    function kick() { if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame); }
    resize();
    return api;
  }
  const mind = makeMind();

  /* ===== LoadingState grid ===== */
  const chevron = Array.from({ length: 9 }, (_, i) => { const r = Math.floor(i / 3), c = i % 3; return (c + Math.abs(r - 1)) * 90; });
  const ORBIT_ORDER = [0, 1, 2, 5, 8, 7, 6, 3];
  const orbitD = Array.from({ length: 9 }, (_, i) => { const k = ORBIT_ORDER.indexOf(i); return k === -1 ? null : k * 110; });
  const PATTERNS = { Drive: { delays: chevron, dur: 650 }, Orbit: { delays: orbitD, dur: 950 } };
  function grid(variant = "Drive") {
    const { delays, dur } = PATTERNS[variant];
    const g = h("span", "grid3"); g.setAttribute("aria-hidden", "true");
    delays.forEach(d => { const c = h("span"); if (d === null) c.style.opacity = ".07"; else c.style.animation = `pixel-on ${dur}ms ease-in-out ${d}ms infinite`; g.appendChild(c); });
    return g;
  }
  const fmtElapsed = t => t < 60 ? t.toFixed(1) + "s" : Math.floor(t / 60) + "m " + (t % 60).toFixed(1) + "s";

  /* ===== tiny markdown ===== */
  const inline = s => esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  function md(src) {
    const out = [], lines = src.split("\n"); let i = 0, para = [];
    const flush = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    while (i < lines.length) {
      const l = lines[i];
      if (/^```/.test(l)) { flush(); const code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue; }
      if (/^#{1,4}\s/.test(l)) { flush(); out.push("<h3>" + inline(l.replace(/^#+\s/, "")) + "</h3>"); i++; continue; }
      if (/^\s*([-*]|\d+\.)\s/.test(l)) {
        flush(); const ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s/, ""));
        const t = ordered ? "ol" : "ul"; out.push(`<${t}>` + items.map(x => "<li>" + inline(x) + "</li>").join("") + `</${t}>`); continue;
      }
      if (!l.trim()) { flush(); i++; continue; }
      para.push(l); i++;
    }
    flush(); return out.join("");
  }

  /* ===== tools =====
   * The agent loop runs on the server (src/thread.ts). The page only turns each tool call it reports into a trace line and a shape. */
  const clip = (s, n) => (s = String(s ?? "")).length > n ? s.slice(0, n) + "\n…[truncated]" : s;
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return String(u).slice(0, 40); } };
  const short = (s, n = 48) => (s = String(s).trim()).length > n ? s.slice(0, n - 1) + "…" : s;
  const TOOL_UI = {
    web_search: { shape: "search", step: a => a.query ? `Searching the web for “${short(a.query)}”` : "Searching the web" },
    web_fetch: { shape: "book", step: a => a.url ? `Reading ${hostOf(a.url)}` : "Reading a page" },
    calculate: { shape: "calculator", step: a => "Calculating " + short(a.expression || "", 40) },
  };
  const MARK = "FOLLOWUPS:";

  /* ===== thread: a fresh one on every page load, so a refresh or a new visit always starts clean ===== */
  const newId = () => crypto.randomUUID();
  let threadId = newId();

  function parseStream(text) {
    const lines = text.replace(/([^\n])(@answer|@scene\s)/g, "$1\n$2").split("\n"), thoughts = [], ans = [];
    const at = lines.findIndex(l => /^\s*@answer\s*$/.test(l));
    lines.forEach((l, i) => {
      const m = l.match(/^\s*@(?:scene|think)\s+([A-Za-z-]+)\s*\|\s*(.*)$/);
      if (m) { if (i < lines.length - 1 || at !== -1) thoughts.push({ i, shape: m[1], text: m[2].trim() }); return; }
      if (/^\s*@/.test(l)) return; // markers, or one still streaming
      if (at === -1 || i > at) ans.push(l);
    });
    let body = ans.join("\n").replace(/^\s+/, ""), fu = [];
    const k = body.indexOf(MARK);
    if (k !== -1) { fu = body.slice(k + MARK.length).split("|").map(s => s.trim()).filter(Boolean).slice(0, 3); body = body.slice(0, k).trimEnd(); }
    else { const nl = body.lastIndexOf("\n"), tail = body.slice(nl + 1).trim(); if (tail && MARK.startsWith(tail)) body = body.slice(0, Math.max(0, nl)).trimEnd(); }
    return { thoughts, body, fu, answering: at !== -1 };
  }

  /* ===== DOM ===== */
  const $ = id => document.getElementById(id);
  const form = $("prompt"), input = $("input"), runEl = $("runBody"), statusEl = $("status");
  const SEND = '<path d="M12 19V5M5 12l7-7 7 7"/>';
  const STOP = '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>';
  let busy = false, ctl = null, unavailable = false, current = null, turnEl = null;

  function sync() {
    const send = $("send");
    send.disabled = !busy && (!input.value.trim() || unavailable);
    $("sendIcon").innerHTML = busy ? STOP : SEND;
    send.setAttribute("aria-label", busy ? "Stop" : "Send");
  }
  function grow() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
  input.addEventListener("input", () => { grow(); sync(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (busy) { ctl?.abort(); return; }
    const q = input.value.trim();
    if (q && !unavailable) go(q);
  });
  function ask(q) { if (busy || unavailable) return; input.value = q; grow(); go(q); }

  /* ===== ThinkingState ===== */
  const mindEl = document.getElementById("mind"), runRoot = document.getElementById("run");
  function thinking() {
    const root = h("div", "think");
    const head = h("button", "th-head"); head.type = "button";
    const lead = h("span", "th-lead"); lead.appendChild(grid("Drive"));
    const status = h("span"); status.setAttribute("role", "status"); status.style.display = "contents";
    const label = h("span", "th-label shimmer", "Thinking");
    const clock = h("span", "th-time", "0.0s");
    status.append(label, clock);
    head.append(lead, status);
    const coll = h("div", "collapse"); const inner = h("div"); const trace = h("div", "trace");
    inner.appendChild(trace); coll.appendChild(inner);
    const side = h("div", "think-side"); side.append(head, coll); root.append(mindEl, side);
    let manual = null, auto = true, settled = false, chev = null;
    const t0 = performance.now();
    const tick = setInterval(() => { clock.textContent = fmtElapsed((performance.now() - t0) / 1000); }, 100);
    const apply = () => {
      const open = manual ?? auto;
      coll.classList.toggle("open", open); head.setAttribute("aria-expanded", open);
      if (chev) chev.style.transform = open ? "rotate(180deg)" : "rotate(0)";
    };
    head.onclick = () => { manual = !(manual ?? auto); apply(); };
    apply();
    return {
      root,
      step(text) {
        trace.querySelector(".p.shimmer")?.classList.remove("shimmer"); // only the step in progress shimmers
        const row = h("div", "th-row"); const p = h("span", "p" + (settled ? "" : " shimmer")); p.textContent = text;
        row.appendChild(p); trace.appendChild(row);
        return { set(t) { p.textContent = t; } };
      },
      settle() {
        if (settled) return; settled = true; clearInterval(tick);
        trace.querySelector(".p.shimmer")?.classList.remove("shimmer");
        const s = Math.max(1, Math.round((performance.now() - t0) / 1000));
        lead.innerHTML = svg(CHEV_DOWN, 14, 'fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"');
        chev = lead.firstChild; chev.classList.add("chev");
        label.className = "th-label done"; label.textContent = "Thought";
        clock.textContent = s + "s";
        apply();
        setTimeout(() => { auto = false; apply(); }, 900);
      },
    };
  }

  /* ===== StreamingText ===== */
  function streamingText(onFinish) {
    const root = h("div"), body = h("div", "answer"); root.appendChild(body);
    const born = []; let target = "", shown = 0, live = true, done = false, primed = false;
    const words = s => [...s.matchAll(/\S+/g)];
    function render(withCaret) {
      const all = words(target);
      const cut = shown >= all.length ? target : (shown ? target.slice(0, all[shown - 1].index + all[shown - 1][0].length) : "");
      body.innerHTML = md(cut);
      const now = performance.now(); let k = 0;
      const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT), nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        const parts = node.nodeValue.split(/(\s+)/), frag = document.createDocumentFragment(); let changed = false;
        for (const part of parts) {
          if (!part || /^\s+$/.test(part)) { frag.append(part); continue; }
          if (born[k] === undefined) born[k] = now;
          const age = now - born[k];
          if (age < 400) { const s = h("span", "w"); s.textContent = part; s.style.animationDelay = -age + "ms"; frag.append(s); changed = true; } else frag.append(part);
          k++;
        }
        if (changed) node.replaceWith(frag);
      }
      if (withCaret) { const last = body.lastElementChild; (last ? (last.matches("ul,ol") ? last.lastElementChild : last) : body).appendChild(h("span", "caret")); }
    }
    const timer = setInterval(() => {
      const total = words(target).length;
      if (shown < total) { shown = Math.min(total, shown + Math.max(1, Math.ceil((total - shown) / 5))); render(true); primed = true; }
      else if (!live && !done) { done = true; clearInterval(timer); render(false); onFinish(); }
      else if (!primed && target) { render(true); primed = true; }
    }, 45);
    return { root, set(t) { target = t; }, end() { live = false; }, stop() { clearInterval(timer); } };
  }

  const ACTIONS = {
    copy: `<g ${STROKE} stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></g>`,
    retry: `<path ${STROKE} stroke-width="1.8" d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>`,
    fresh: `<path ${STROKE} stroke-width="1.8" d="M12 5v14M5 12h14"/>`,
    up: `<path ${STROKE} stroke-width="1.8" d="M7 10v12M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/>`,
    down: `<path ${STROKE} stroke-width="1.8" d="M17 14V2M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/>`,
  };
  function finishUI(q, bodyText, fus) {
    const row = h("div", "actions"), msg = h("span", "act-note");
    const mk = (key, label, fn) => { const b = h("button", "act", svg(ACTIONS[key], 15)); b.type = "button"; b.setAttribute("aria-label", label); b.title = label; b.onclick = () => fn(b); row.appendChild(b); return b; };
    mk("copy", "Copy", async () => { try { await navigator.clipboard.writeText(bodyText); msg.textContent = "Copied"; } catch { msg.textContent = "Copy isn't available here"; } row.appendChild(msg); setTimeout(() => msg.remove(), 1600); });
    mk("retry", "Retry", () => ask(q));
    mk("fresh", "New chat", () => { current?.stop(); threadId = newId(); runEl.replaceChildren(); input.value = ""; grow(); sync(); input.focus(); });
    const up = mk("up", "Good response", b => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); down.setAttribute("aria-pressed", "false"); });
    const down = mk("down", "Bad response", b => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); up.setAttribute("aria-pressed", "false"); });
    turnEl.appendChild(row);
    if (fus.length) {
      const wrap = h("div", "fu"); wrap.appendChild(h("p", "fu-title", "Follow-ups"));
      const list = h("div", "fu-list");
      fus.forEach((t, i) => {
        const b = h("button", "fu-item", svg('<path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>', 11, 'fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"'));
        b.type = "button"; b.style.animationDelay = i * 90 + "ms"; b.appendChild(document.createTextNode(t)); b.onclick = () => ask(t);
        list.appendChild(b);
      });
      wrap.appendChild(list); turnEl.appendChild(wrap);
    }
  }
  const note = msg => { const p = h("p", "note"); p.textContent = msg; turnEl.appendChild(p); };

  /* ===== one exchange ===== */
  async function go(q) {
    current?.stop(); stopTurns();
    // One exchange on screen at a time: a new question replaces the last one.
    turnEl = h("div", "turn"); runEl.replaceChildren(turnEl);
    busy = true; sync();
    const think = thinking(); turnEl.appendChild(think.root);
    // Dots float loose until the model names its first scene, then pull together into it.
    mindEl.hidden = false; let first = true;
    mind.scatter("sphere"); mind.live(true);
    let full = "", answering = false, ended = false, stream = null;

    // Each scene holds the stage long enough to be seen; when the answer starts, the rest play out faster.
    const queue = []; let pumping = null;
    const pump = () => {
      if (pumping) return;
      if (!queue.length) { if (answering) reveal(); return; }
      const shape = queue.shift();
      if (first) { first = false; mind.conjure(shape); } else mind.show(shape);
      if (shape === "cube") startTurns("R U R' U' F2 L D'"); else stopTurns();
      pumping = setTimeout(() => { pumping = null; pump(); }, answering ? 550 : 1100);
    };
    const showSoon = shape => { queue.push(normShape(shape)); pump(); };

    const finish = () => {
      const { body, fu } = parseStream(full);
      if (body) finishUI(q, body, fu);
      busy = false; ctl = null; sync();
    };
    // Tuck the visual and trace away so the streamed answer takes the stage.
    const reveal = () => {
      if (stream) return;
      think.settle(); stopTurns(); mindEl.hidden = true; mind.live(false);
      stream = streamingText(finish); turnEl.appendChild(stream.root);
      stream.set(parseStream(full).body);
      if (ended) stream.end();
    };
    const startAnswer = () => { if (answering) return; answering = true; pump(); };
    current = { stop() { stream?.stop(); clearTimeout(pumping); pumping = null; queue.length = 0; stopTurns(); } };

    const rows = new Map();
    const onText = text => {
      full = text;
      const p = parseStream(text);
      for (const t of p.thoughts) {
        const r = rows.get(t.i);
        if (!r) { rows.set(t.i, { text: t.text, row: think.step(t.text || "…") }); showSoon(t.shape); }
        else if (r.text !== t.text) { r.text = t.text; r.row.set(t.text); }
      }
      if (p.answering) startAnswer();
      stream?.set(p.body);
    };

    ctl = new AbortController();
    const fail = code => {
      if (full && code !== "cancelled") { ended = true; startAnswer(); stream?.end(); }
      else { current.stop(); think.settle(); mindEl.hidden = true; mind.live(false); busy = false; ctl = null; sync(); }
      note(code === "cancelled" ? "Stopped." : copyFor(code));
    };
    try {
      const res = await fetch(`/api/chat?thread=${threadId}`, {
        method: "POST", signal: ctl.signal, headers: { "content-type": "application/json" },
        body: JSON.stringify({ q, ctx: {
          time: new Date().toLocaleString(navigator.language || "en-US", { dateStyle: "full", timeStyle: "short" }),
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone, lang: navigator.language || "en-US",
        } }),
      });
      if (!res.ok) { const e = await res.json().catch(() => ({})); return fail(e.error || "failed"); }
      // NDJSON events: text deltas, tool calls (each becomes a trace line and a shape), then done or error.
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "", text = "", done = false;
      while (true) {
        const { value, done: eof } = await reader.read();
        if (eof) break;
        buf += value;
        let nl;
        while ((nl = buf.indexOf("\n")) !== -1) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
          if (!line.trim()) continue;
          const e = JSON.parse(line);
          if (e.t === "text") { text += e.d; onText(text); }
          else if (e.t === "tool") { const ui = TOOL_UI[e.name]; if (ui) { think.step(ui.step(e.input || {})); showSoon(ui.shape); } }
          else if (e.t === "done") { done = true; ended = true; startAnswer(); stream?.end(); if (e.truncated) note("The answer was cut short. Ask for less at a time."); }
          else if (e.t === "error") return fail(e.code);
        }
      }
      if (!done) fail("failed");
    } catch (e) {
      fail(e?.name === "AbortError" ? "cancelled" : "failed");
    }
  }

  function copyFor(code) {
    return ({
      rate_limited: "You're sending messages quickly. Wait a moment, then try again.",
      busy: "This chat is still answering in another tab.",
      bad_message: "That message is too long. Try a shorter one.",
      no_credits: "The app is out of AI credits right now.",
    })[code] || "Something went wrong reaching the agent. Send again to retry.";
  }
  function setUnavailable(msg) { unavailable = true; statusEl.textContent = msg; statusEl.hidden = false; sync(); }

  /* ===== cube: layer turns while the cube is on stage ===== */
  const MOVES = { R: [0, 1, -1], L: [0, -1, 1], U: [1, 1, -1], D: [1, -1, 1], F: [2, 1, -1], B: [2, -1, 1] };
  let turnRaf = 0, turnOn = false;
  function startTurns(seq) {
    if (turnOn) return;
    turnOn = true;
    const list = seq.split(/\s+/).map(m => { const [ax, lay, dir] = MOVES[m[0]]; const amt = m.includes("2") ? 2 : 1; return { ax, lay, ang: dir * (m.includes("'") ? -1 : 1) * amt * Math.PI / 2, dur: amt === 2 ? 1500 : 1050 }; });
    let i = 0, t0 = performance.now();
    const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const step = now => {
      if (!turnOn) return;
      const m = list[i], k = (now - t0) / m.dur;
      if (k >= 1) { mind.turn(0, 9, 0); if (now - t0 > m.dur + 340) { i = (i + 1) % list.length; t0 = now; } }
      else mind.turn(m.ax, m.lay, m.ang * ease(Math.max(0, k)));
      turnRaf = requestAnimationFrame(step);
    };
    if (!reduced) turnRaf = requestAnimationFrame(step);
  }
  function stopTurns() { turnOn = false; cancelAnimationFrame(turnRaf); mind.turn(0, 9, 0); }

  /* ===== boot ===== */
  sync(); input.focus();
})();
</script>

</body></html>
